name: TESP Project Configuration Service CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/project-config-service/**'
      - 'shared/tesp-common/**'
      - 'frontend/**'
      - 'infra/terraform/project_config.tf'
      - '.github/workflows/project-config-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/project-config-service/**'
      - 'shared/tesp-common/**'
      - 'frontend/**'
      - 'infra/terraform/project_config.tf'

jobs:
  backend-test:
    name: Build & Test Backend Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run Maven Unit/Integration Tests
        run: mvn test -pl shared/tesp-common,services/project-config-service

  frontend-build:
    name: Verify Frontend TypeScript & React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Run TypeScript Compiler Check
        run: cd frontend && npx tsc --noEmit

      - name: Build Vite Production Bundle
        run: cd frontend && npm run build

  terraform-validate:
    name: Validate Terraform HCL Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init & Validate Terraform Code
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
