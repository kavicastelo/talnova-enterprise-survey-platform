      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: survey-distribution-service
    container_name: tesp-survey-distribution-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_dist_db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tesp-network
    depends_on:
      - mongodb
