  # --- Frontend SPA ---
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: tesp-frontend
    ports:
      - "3000:80"
    networks:
      - tesp-network
    depends_on:
      - api-gateway

networks:
  tesp-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
