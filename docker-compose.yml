services:
  # --- Infrastructure Services ---
  mongodb:
    image: mongo:7.0
    container_name: tesp-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    networks:
      - tesp-network
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: tesp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - tesp-network
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tesp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - tesp-network

  # --- Application Ingress & Gateway ---
  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    container_name: tesp-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONFIG_SERVICE_HOST: tesp-project-config-service
      ORG_SERVICE_HOST: tesp-organization-service
      EMP_SERVICE_HOST: tesp-employee-service
      SURVEY_SERVICE_HOST: tesp-survey-builder-service
      DIST_SERVICE_HOST: tesp-survey-distribution-service
      INGEST_SERVICE_HOST: tesp-response-ingestion-service
      ANALYTICS_SERVICE_HOST: tesp-analytics-engine-service
      REPORTING_SERVICE_HOST: tesp-reporting-service
      ACTION_SERVICE_HOST: tesp-action-planning-service
      AI_SERVICE_HOST: tesp-ai-analytics-service
      NOTIF_SERVICE_HOST: tesp-notification-service
      AUDIT_SERVICE_HOST: tesp-audit-service
    networks:
      - tesp-network
    depends_on:
      - redis
      - project-config-service
      - organization-service
      - employee-service

  # --- Backend Microservices ---
  project-config-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: project-config-service
    container_name: tesp-project-config-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_config_db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - tesp-network
    depends_on:
      - mongodb
      - redis

  organization-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: organization-service
    container_name: tesp-organization-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_org_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tesp-network
    depends_on:
      - mongodb
      - kafka

  employee-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: employee-service
    container_name: tesp-employee-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tesp-network
    depends_on:
      - mongodb
      - kafka

  # --- Frontend SPA ---
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: tesp-frontend
    ports:
      - "3000:80"
    networks:
      - tesp-network
    depends_on:
      - api-gateway

networks:
  tesp-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
