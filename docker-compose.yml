services:
  # --- Infrastructure Services ---
  mongodb:
    image: mongo:7.0
    container_name: tesp-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    networks:
      - tesp-network
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: tesp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - tesp-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tesp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - tesp-network

  # --- Application Ingress & Gateway ---
  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    container_name: tesp-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROJECT_CONFIG_SERVICE_URI: http://project-config-service:8081
      ORGANIZATION_SERVICE_URI: http://organization-service:8082
      EMPLOYEE_SERVICE_URI: http://employee-service:8083
      SURVEY_BUILDER_SERVICE_URI: http://survey-builder-service:8084
      SURVEY_DISTRIBUTION_SERVICE_URI: http://survey-distribution-service:8085
      RESPONSE_INGESTION_SERVICE_URI: http://response-ingestion-service:8086
      ANALYTICS_ENGINE_SERVICE_URI: http://analytics-engine-service:8087
      AI_ANALYTICS_SERVICE_URI: http://ai-analytics-service:8088
      REPORTING_SERVICE_URI: http://reporting-service:8089
      ACTION_PLANNING_SERVICE_URI: http://action-planning-service:8090
      NOTIFICATION_SERVICE_URI: http://notification-service:8091
      AUDIT_SERVICE_URI: http://audit-service:8092
    networks:
      - tesp-network
    depends_on:
      - redis
      - project-config-service
      - organization-service
      - employee-service

  # --- Backend Microservices (10 Feature Services + 2 Shared Services) ---
  project-config-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: project-config-service
    container_name: tesp-project-config-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_config_db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tesp-network
    depends_on:
      - mongodb
      - redis

  organization-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: organization-service
    container_name: tesp-organization-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_org_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tesp-network
    depends_on:
      - mongodb
      - kafka

  employee-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: employee-service
    container_name: tesp-employee-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_employee_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tesp-network
    depends_on:
      - mongodb
      - kafka

  survey-builder-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: survey-builder-service
    container_name: tesp-survey-builder-service
    ports:
      - "8084:8084"
    environment:
