      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_survey_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tesp-network
    depends_on:
      - mongodb
      - kafka

  survey-distribution-service:
