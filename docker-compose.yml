      args:
        SERVICE_NAME: ai-analytics-service
    container_name: tesp-ai-analytics-service
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tesp_ai_db?authSource=admin
