server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: project-config-service
          uri: ${PROJECT_CONFIG_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/projects/**
        - id: organization-service
          uri: ${ORGANIZATION_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/nodes/**
        - id: employee-service
          uri: ${EMPLOYEE_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/employees/**
        - id: survey-builder-service
          uri: ${SURVEY_BUILDER_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/surveys/**
        - id: survey-distribution-service
          uri: ${SURVEY_DISTRIBUTION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/campaigns/**
        - id: response-ingestion-service
          uri: ${RESPONSE_INGESTION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/responses/**
        - id: analytics-engine-service
          uri: ${ANALYTICS_ENGINE_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/analytics/**
        - id: ai-analytics-service
          uri: ${AI_ANALYTICS_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/ai/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/reports/**
        - id: action-planning-service
          uri: ${ACTION_PLANNING_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/v1/actions/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/api/v1/notifications/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URI:http://localhost:8092}
          predicates:
            - Path=/api/v1/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
